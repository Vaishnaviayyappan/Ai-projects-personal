services:
  postgres:
    image: postgres:16-alpine
    container_name: netbank-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: netbank
      POSTGRES_PASSWORD: netbank
      POSTGRES_DB: netbank
    ports:
      - "5434:5432"
    volumes:
      - netbank-pgdata:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netbank -d netbank"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  netbank-pgdata:
